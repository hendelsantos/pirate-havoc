name: Import official challenge assets

on:
  push:
    branches: [automation/official-assets]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply integration changes from automation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin automation/official-assets
          git merge --no-ff origin/automation/official-assets -m "merge: official asset integration automation"
      - name: Download official challenge repository
        run: git clone --depth 1 https://github.com/junglegaming/game-developer-challenge.git /tmp/game-developer-challenge
      - name: Preserve and inventory official assets
        run: node scripts/sync-official-assets.mjs /tmp/game-developer-challenge/assets public/assets/official
      - name: Commit assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/official
          git commit -m "assets: import official Jungle Gaming package"
          git push origin main

